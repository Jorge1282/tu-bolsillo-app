<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-title" content="Tu Bolsillo App">
<meta name="description" content="Tu Bolsillo App — finanzas y contabilidad personal en Bs. y USD, con tasa BCV del día. Tus datos se guardan solo en tu teléfono.">
<title>Tu Bolsillo App</title>

<meta name="theme-color" content="#12201A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --ink: #12201A;
    --surface: #1B2A22;
    --surface-2: #223328;
    --gold: #C9A24B;
    --coral: #E2694B;
    --teal: #6FA98D;
    --text: #EDE7D9;
    --text-dim: #9AA79C;
    --text-faint: #5E6B60;
    --line: rgba(237,231,217,0.14);
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  body { font-family: var(--font-body); color: var(--text); }
  input, select, button { font-family: var(--font-body); }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  button { cursor: pointer; }

  #app { min-height: 100vh; display: flex; flex-direction: column; position: relative; padding-bottom: 84px; max-width: 480px; margin: 0 auto; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .header { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px; }
  .eyebrow { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-faint); }
  .wordmark { font-family: var(--font-display); font-size: 26px; font-weight: 700; font-style: italic; color: var(--gold); letter-spacing: 0.3px; }
  .title { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin-top: 2px; }

  .warn-banner { margin: 0 20px 8px; padding: 8px 12px; background: rgba(226,105,75,0.15); color: var(--coral); font-size: 12px; border-radius: 8px; }

  .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 14px; border-bottom: 1px dashed var(--line); margin: 0 20px; }
  .month-label { font-family: var(--font-display); font-size: 15px; text-transform: capitalize; }
  .icon-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--text); }
  .icon-btn:disabled { opacity: 0.35; }
  .icon-btn.spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .rate-bar { display: flex; align-items: center; justify-content: space-between; margin: 12px 20px 0; padding: 10px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
  .rate-label { font-family: var(--font-mono); font-size: 12.5px; color: var(--gold); }
  .rate-sub { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }

  .main { flex: 1; padding: 16px 20px 8px; overflow-y: auto; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .stat-card { background: var(--surface); border-radius: 12px; padding: 14px; border-top: 2px solid; }
  .stat-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .stat-card-head span { color: var(--text-dim); font-size: 12px; letter-spacing: 0.4px; }
  .stat-main { font-family: var(--font-mono); font-size: 17px; font-weight: 600; }
  .stat-sub { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); margin-top: 3px; }

  .balance-card { background: var(--surface-2); border-radius: 12px; padding: 16px; margin-bottom: 22px; border: 1px solid var(--line); }
  .saldo-card { background: linear-gradient(135deg, rgba(201,162,75,0.14), var(--surface-2)); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(201,162,75,0.35); }
  .saldo-note { font-size: 10.5px; color: var(--text-faint); margin-top: 10px; line-height: 1.6; }
  .saldo-note-line { display: block; }
  .mes-actual-value { font-size: 12.5px; font-weight: 700; font-family: var(--font-mono); }
  .balance-line { display: flex; align-items: center; justify-content: space-between; }
  .balance-line span { font-size: 13px; color: var(--text-dim); }
  .balance-row { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .balance-value { font-family: var(--font-mono); font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
  .balance-value-small { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }
  .balance-equal-row { display: flex; align-items: stretch; gap: 14px; margin-top: 10px; }
  .balance-equal-col { flex: 1; min-width: 0; }
  .balance-equal-label { font-size: 10px; letter-spacing: 1px; color: var(--text-faint); margin-bottom: 4px; }
  .balance-equal-value { font-family: var(--font-mono); font-size: 15px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
  .balance-divider { width: 1px; background: var(--line); }
  .balance-combined { font-size: 11.5px; color: var(--text-dim); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .balance-combined strong { color: var(--gold); font-family: var(--font-mono); }

  .section-label { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-faint); margin: 6px 0 10px; }
  .empty-note { color: var(--text-dim); font-size: 13px; padding: 12px 0; line-height: 1.5; }

  .ledger-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 10px; }
  .group-header { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .group-header-btn { width: 100%; background: transparent; border: none; border-radius: 0; padding: 8px 2px 10px; cursor: pointer; text-align: left; }
  .group-title-wrap { display: flex; align-items: center; gap: 7px; }
  .group-chevron { display: inline-flex; color: var(--text-faint); transition: transform 0.15s ease; }

  .group-title { font-family: var(--font-display); font-size: 14.5px; color: var(--gold); text-transform: capitalize; }
  .group-net { font-family: var(--font-mono); font-size: 11.5px; display: flex; gap: 8px; }
  .group-net-badge { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--gold); background: rgba(201,162,75,0.14); border: 1px solid rgba(201,162,75,0.35); border-radius: 20px; padding: 4px 12px; flex-shrink: 0; }
  .export-option { background: var(--surface); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .export-option-title { font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .export-option-desc { font-size: 11.5px; color: var(--text-dim); line-height: 1.5; margin-bottom: 10px; }
  .day-divider { font-size: 10px; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-faint); margin: 12px 2px 4px; text-transform: capitalize; }

  .cat-row-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cat-label { font-size: 13.5px; font-weight: 600; }
  .cat-currency-line { margin-top: 10px; }
  .cat-currency-line:first-of-type { margin-top: 0; }
  .cat-currency-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .cat-currency-tag { font-size: 9.5px; color: var(--text-faint); letter-spacing: 0.5px; text-transform: uppercase; }
  .cat-currency-bottom { font-family: var(--font-mono); font-size: 12px; color: var(--coral); margin-top: 5px; }
  .cat-budget-of { color: var(--text-faint); font-weight: 400; }
  .cat-pct-badge { font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; }
  .cat-pct-badge.badge-ok { background: rgba(159,169,159,0.16); color: var(--text-dim); }
  .cat-pct-badge.badge-warn { background: rgba(224,169,78,0.2); color: #E0A94E; }
  .cat-pct-badge.badge-over { background: rgba(255,92,92,0.2); color: #ff5c5c; }
  .cat-amount { font-family: var(--font-mono); font-size: 13px; color: var(--coral); }
  .bar-track { height: 5px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--coral); border-radius: 4px; }
  .budget-note { font-size: 10px; color: var(--text-faint); margin-top: 4px; }
  .bar-fill-gold { height: 100%; background: var(--gold); border-radius: 4px; }

  .tx-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 10px 12px; }
  .tx-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .tx-label { font-size: 13.5px; }
  .tx-date { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-amount { font-family: var(--font-mono); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .trash-btn { padding: 4px; flex-shrink: 0; background: transparent; border: none; color: var(--text-faint); }
  .trash-btn + .trash-btn { margin-left: 2px; }

  .day-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 10px; padding: 9px 12px; }
  .day-num { font-family: var(--font-display); font-size: 16px; color: var(--text-dim); width: 22px; flex-shrink: 0; }
  .day-mid { flex: 1; min-width: 0; }
  .day-net { font-family: var(--font-mono); font-size: 11.5px; }
  .day-net-empty { font-size: 11.5px; color: var(--text-faint); font-style: italic; }
  .day-rate { font-size: 10px; color: var(--text-faint); margin-top: 2px; }
  .day-balance { text-align: right; flex-shrink: 0; }
  .day-balance-usd { font-family: var(--font-mono); font-size: 13px; color: var(--gold); font-weight: 600; }
  .day-balance-ves { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); margin-top: 1px; }
  .day-balance-combined { font-family: var(--font-mono); font-size: 10px; color: var(--teal); margin-top: 2px; }

  .goal-card { background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .goal-ring-card { display: flex; align-items: center; gap: 16px; background: var(--surface); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .goal-ring-body { flex: 1; min-width: 0; }
  .goal-ring-label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .goal-ring-numbers { font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--text); }
  .goal-ring-of { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 3px; }
  .ahorro-form-card { background: var(--surface); border-radius: 12px; padding: 16px; margin-top: 10px; }
  .ahorro-form-row { margin-bottom: 12px; }
  .ahorro-form-row .form-row { gap: 8px; margin-top: 4px; }
  .ahorro-form-row .form-label { margin-bottom: 4px; }
  .ahorro-meta-total { font-family: var(--font-mono); font-size: 12px; color: var(--gold); background: rgba(201,162,75,0.1); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }

  .goal-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .goal-pct { font-family: var(--font-mono); font-size: 13px; color: var(--gold); }
  .goal-numbers { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); margin-top: 8px; }

  .form-group { margin-bottom: 12px; }
  .form-row { display: flex; gap: 10px; }
  .form-label { display: block; font-size: 11.5px; color: var(--text-dim); margin-bottom: 5px; letter-spacing: 0.3px; }
  .input, select.input { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; color: var(--text); font-size: 14px; }

  .primary-btn { width: 100%; background: var(--gold); color: var(--ink); font-weight: 700; border: none; border-radius: 10px; padding: 13px 0; font-size: 14.5px; margin-top: 6px; }
  .primary-btn:disabled { opacity: 0.5; }

  .segmented { display: flex; gap: 6px; background: var(--surface-2); border-radius: 9px; padding: 4px; }
  .segment-btn { flex: 1; padding: 9px 0; border-radius: 7px; background: transparent; color: var(--text-dim); border: none; font-size: 13.5px; font-weight: 600; }
  .segment-btn.sm { padding: 7px 0; font-size: 12.5px; }
  .segment-btn.active-coral { background: rgba(226,105,75,0.18); color: var(--coral); }
  .segment-btn.active-teal { background: rgba(111,169,141,0.18); color: var(--teal); }
  .segment-btn.active-gold { background: rgba(201,162,75,0.2); color: var(--gold); }

  .menu-card { width: 100%; display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; text-align: left; }
  .menu-card-icon { color: var(--gold); flex-shrink: 0; }
  .menu-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .menu-card-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .menu-card-sub { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .menu-card-chevron { color: var(--text-faint); flex-shrink: 0; }
  .back-btn { display: flex; align-items: center; gap: 4px; background: transparent; border: none; color: var(--gold); font-size: 13.5px; font-weight: 600; padding: 4px 0; margin-bottom: 14px; }

  .fab { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: var(--gold); color: var(--ink); border: none; border-radius: 30px; padding: 12px 22px; box-shadow: 0 8px 20px rgba(0,0,0,0.35); font-size: 14px; font-weight: 600; max-width: 440px; z-index: 5; }
  .nav-add-btn { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: var(--ink); border: none; flex-shrink: 0; align-self: center; }

  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-around; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 0 14px; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; background: transparent; border: none; color: var(--text-dim); }
  .nav-btn.active { color: var(--gold); }
  .nav-btn span { font-size: 10px; margin-top: 3px; }

  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: var(--ink); border-radius: 20px 20px 0 0; padding: 10px 20px 26px; border-top: 1px solid var(--line); }
  .sheet-handle { width: 40px; height: 4px; background: var(--line); border-radius: 4px; margin: 4px auto 14px; }
  .sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .sheet-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; }

  svg { display: block; }

  .lock-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
  .lock-sub { font-size: 13px; color: var(--text-dim); margin-top: 8px; margin-bottom: 24px; max-width: 280px; line-height: 1.5; }
  .auth-card { width: 100%; max-width: 280px; }
  .auth-field { text-align: left; margin-bottom: 12px; }
  .auth-field label { display: block; font-size: 10.5px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-faint); margin-bottom: 5px; }
  .auth-input { width: 100%; text-align: left; font-size: 15px; letter-spacing: normal; font-family: var(--font-body); }
  .lock-error { color: var(--coral); font-size: 12px; margin-top: 4px; text-align: left; }
  .lock-btn { max-width: 280px; margin-top: 6px; }
  .auth-note { margin-top: 20px; max-width: 280px; text-align: left; background: var(--surface-2); border: 1px solid rgba(201,162,75,0.3); border-radius: 10px; padding: 12px 14px; }
  .auth-note-title { display: block; font-size: 10.5px; letter-spacing: 0.6px; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 5px; }
  .auth-note-body { font-size: 11.5px; color: var(--text-dim); line-height: 1.55; }
</style>

<body>
<div id="app"></div>

<script>
/* ---------- data ---------- */
/* Esta versión guarda todo localmente por defecto (localStorage del dispositivo),
   protegido por el usuario/contraseña que cada persona crea en su propio teléfono.
   Además, cada persona puede conectar SU PROPIA cuenta de Google (opcional) para
   guardar un respaldo en SU Google Drive personal — nunca en un servidor de esta app. */

/* ====== RESPALDO EN GOOGLE DRIVE (opcional) ======
   1) Creá un OAuth Client ID tipo "Web application" en:
      https://console.cloud.google.com/apis/credentials
   2) Agregá tu dominio (ej. https://jorge1282.github.io) en "Authorized JavaScript origins".
   3) Reemplazá GOOGLE_CLIENT_ID abajo con el Client ID que te dieron.
   Si dejás el valor de ejemplo (empieza con "TU_"), el botón de Drive queda oculto
   y la app sigue funcionando 100% local igual que antes. */
var GOOGLE_CLIENT_ID = 'TU_CLIENT_ID.apps.googleusercontent.com';
var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
var DRIVE_BACKUP_FILENAME = 'mi-bolsillo-app-respaldo.json';
/* =================================================== */

var DEFAULT_EXPENSE_CATEGORIES = [];
var DEFAULT_INCOME_CATEGORIES = [];
/* Categorías 100% personalizadas: no hay predeterminadas en esta versión.
   Cada persona crea las suyas en tiempo real. EXPENSE_CATEGORIES / INCOME_CATEGORIES /
   ALL_CATEGORIES se recalculan con rebuildCategoryLists() cada vez que cambian. */
var EXPENSE_CATEGORIES = DEFAULT_EXPENSE_CATEGORIES.slice();
var INCOME_CATEGORIES = DEFAULT_INCOME_CATEGORIES.slice();
var ALL_CATEGORIES = EXPENSE_CATEGORIES.concat(INCOME_CATEGORIES);
function getPaymentCategories(){
  /* En esta versión, cualquier categoría de egreso puede tener compromisos de pago. */
  return EXPENSE_CATEGORIES.map(function(c){ return c.id; });
}
function catLabel(id){
  for (var i=0;i<ALL_CATEGORIES.length;i++){ if (ALL_CATEGORIES[i].id===id) return ALL_CATEGORIES[i].label; }
  return 'Otro';
}
function rebuildCategoryLists(){
  var customExpense = (state.customCategories && state.customCategories.expense) || [];
  var customIncome = (state.customCategories && state.customCategories.income) || [];
  EXPENSE_CATEGORIES = DEFAULT_EXPENSE_CATEGORIES.concat(customExpense);
  INCOME_CATEGORIES = DEFAULT_INCOME_CATEGORIES.concat(customIncome);
  ALL_CATEGORIES = EXPENSE_CATEGORIES.concat(INCOME_CATEGORIES);
}
function slugifyCategory(label){
  var s = String(label).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  return s || 'categoria';
}
function addCustomCategory(type, label){
  label = (label||'').trim();
  if (!label){ window.alert('Escribe un nombre para la categoría.'); return null; }
  var base = slugifyCategory(label);
  var id = base, n = 1;
  while (ALL_CATEGORIES.some(function(c){ return c.id === id; })){
    n++; id = base + '_' + n;
  }
  var key = type === 'ingreso' ? 'income' : 'expense';
  if (!state.customCategories) state.customCategories = { expense: [], income: [] };
  if (!state.customCategories[key]) state.customCategories[key] = [];
  state.customCategories[key].push({ id: id, label: label });
  rebuildCategoryLists();
  saveCustomCategoriesToStorage();
  pushToCloud();
  return id;
}
function deleteCustomCategory(type, id){
  if (!window.confirm('¿Eliminar esta categoría? Los movimientos que ya la usan quedarán marcados como "Otro" en los resúmenes.')) return;
  var key = type === 'ingreso' ? 'income' : 'expense';
  if (state.customCategories && state.customCategories[key]){
    state.customCategories[key] = state.customCategories[key].filter(function(c){ return c.id !== id; });
  }
  rebuildCategoryLists();
  saveCustomCategoriesToStorage();
  pushToCloud();
  render();
}
function startEditCategory(type, id){
  state.editingCategory = { type: type, id: id };
  render();
  setTimeout(function(){ var el = document.getElementById('editCategoryLabel_' + id); if (el) el.focus(); }, 0);
}
function cancelEditCategory(){
  state.editingCategory = null;
  render();
}
function saveEditCategory(type, id){
  var el = document.getElementById('editCategoryLabel_' + id);
  var label = (el ? el.value : '').trim();
  if (!label){ window.alert('Escribe un nombre para la categoría.'); return; }
  var key = type === 'ingreso' ? 'income' : 'expense';
  var item = (state.customCategories[key] || []).find(function(c){ return c.id === id; });
  if (item) item.label = label;
  state.editingCategory = null;
  rebuildCategoryLists();
  saveCustomCategoriesToStorage();
  pushToCloud();

/* ---------- seguridad (usuario y contraseña, 100% local) ---------- */
function simpleHash(str){
  var hash = 5381;
  for (var i=0;i<str.length;i++){ hash = ((hash*33) ^ str.charCodeAt(i)) >>> 0; }
  return hash.toString(16);
}

/* ---------- sistema Pro (código de activación) ---------- */
function computeCodeChecksum(plan, serial){
  return simpleHash(PRO_SECRET + '-' + plan + '-' + serial).slice(0, 6).toUpperCase();
}
function parseActivationCode(raw){
  var clean = (raw || '').trim().toUpperCase().replace(/\s+/g, '');
  var parts = clean.split('-');
  if (parts.length !== 4 || parts[0] !== 'TB') return null;
  var plan = parts[1], serial = parts[2], checksum = parts[3];
  if (!PRO_PLAN_DAYS[plan]) return null;
  var expected = computeCodeChecksum(plan, serial);
  if (expected !== checksum) return null;
  return { plan: plan, serial: serial, days: PRO_PLAN_DAYS[plan] };
}

  return todayStr() <= state.pro.expiresAt;

function proDaysLeft(){
  if (!state.pro || !state.pro.expiresAt) return null;
  var diff = Math.round((new Date(state.pro.expiresAt + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
  return diff;
}

function generateRecoveryCode(){
  var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; /* sin 0/O ni 1/I/L, para que no se confundan al copiar a mano */
  var groups = [];
  for (var g = 0; g < 3; g++){
    var s = '';
    for (var i = 0; i < 4; i++){ s += chars.charAt(Math.floor(Math.random() * chars.length)); }
    groups.push(s);
  }
  return groups.join('-');
}

  if (p.length < 4){ state.authError = 'La contraseña debe tener al menos 4 caracteres.'; render(); return; }
  if (p !== p2){ state.authError = 'Las contraseñas no coinciden.'; render(); return; }
  var code = generateRecoveryCode();
  state.authUsername = u;
  state.authPassHash = simpleHash(p);

    if (ves > 0 || usd > 0) budgets[c.id] = { usd: usd, ves: ves };
  });
  state.budgets = budgets;
  saveBudgetsToStorage();
  pushToCloud();
  render();
  window.alert('Presupuestos guardados.');
}
function budgetEquivalentInline(amount, currency){
  var rate = getRateForDate(todayStr());
  if (!rate || !amount) return '';
  if (currency === 'USD') return ' (≈ ' + fmt(amount * rate, 'VES') + ' hoy)';
  return ' (≈ ' + fmt(amount / rate, 'USD') + ' hoy)';
}

function addPaymentDate(catId){
  var dateEl = document.getElementById('payDate_' + catId);
  var date = dateEl ? dateEl.value : '';
  if (!date){ window.alert('Selecciona una fecha de pago.'); return; }
  var note = (document.getElementById('payNote_' + catId).value || '').trim();
  var amount = Number(document.getElementById('payAmount_' + catId).value) || 0;
  var currency = document.getElementById('payCurrency_' + catId).value;
  var personEl = document.getElementById('payPerson_' + catId);
  var person = personEl ? personEl.value : '';

  if (state.editingPayment && state.editingPayment.catId === catId){
    var list = state.paymentCommitments[catId] || [];
    var item = list.find(function(p){ return p.id === state.editingPayment.id; });
    if (item){
      item.date = date; item.note = note; item.amount = amount; item.currency = currency; item.person = person;
    }
    state.editingPayment = null;
  } else {
    if (!state.paymentCommitments[catId]) state.paymentCommitments[catId] = [];
    state.paymentCommitments[catId].push({ id: uid(), date: date, note: note, amount: amount, currency: currency, person: person, paid: false });
  }
  savePaymentsToStorage();
  pushToCloud();
  render();
}
function editPaymentDate(catId, id){

  state.expandedGroups['pagoscat-' + catId] = true;

function cancelEditPayment(){

  render();
}
function togglePaymentPaid(catId, id){
  var list = state.paymentCommitments[catId] || [];
  var item = list.find(function(p){ return p.id === id; });
  if (item) item.paid = !item.paid;
  savePaymentsToStorage();
  pushToCloud();
  render();
}
function deletePaymentDate(catId, id){
  if (state.editingPayment && state.editingPayment.catId === catId && state.editingPayment.id === id) state.editingPayment = null;
  state.paymentCommitments[catId] = (state.paymentCommitments[catId] || []).filter(function(p){ return p.id !== id; });
  savePaymentsToStorage();
  pushToCloud();
  render();
}
function getUpcomingPayments(){
  var today = todayStr();
  var list = [];
  getPaymentCategories().forEach(function(catId){
    (state.paymentCommitments[catId] || []).forEach(function(p){
      if (p.paid) return;
      var diffDays = Math.round((new Date(p.date + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000);
      list.push({ catId: catId, label: catLabel(catId), date: p.date, note: p.note, person: p.person, amount: p.amount, currency: p.currency, diffDays: diffDays, id: p.id });
    });
  });
  list.sort(function(a,b){ return a.diffDays - b.diffDays; });
  return list;
}

/* ---------- notificaciones ---------- */
function isNotificationSupported(){
  return typeof Notification !== 'undefined' && 'serviceWorker' in navigator;
}
function getNotificationStatus(){
  if (!isNotificationSupported()) return 'unsupported';
  return Notification.permission; /* 'default' | 'granted' | 'denied' */
}
function requestNotificationPermission(){
  if (!isNotificationSupported()){
    window.alert('Tu navegador no soporta notificaciones, o necesitas instalar la app (no solo abrirla en una pestaña normal) para poder activarlas.');
    return;
  }
  Notification.requestPermission().then(function(perm){
    render();
    if (perm === 'granted'){
      checkAndNotifyPayments(true);
    } else if (perm === 'denied'){
      window.alert('Quedaron bloqueadas. Si cambias de opinión, tendrás que activarlas desde los ajustes de notificaciones de tu navegador o del sistema para este sitio/app.');
    }
  });
}
function loadNotifiedLog(){
  return Store.get(STORAGE_KEY_NOTIFIED, {});
}
function saveNotifiedLog(log){
  Store.set(STORAGE_KEY_NOTIFIED, log);
}
function checkAndNotifyPayments(force){
  if (getNotificationStatus() !== 'granted') return;
  var today = todayStr();
  var log = loadNotifiedLog();
  var upcoming = getUpcomingPayments().filter(function(p){ return p.diffDays <= 3; });
  if (!upcoming.length) return;
  navigator.serviceWorker.ready.then(function(reg){
    upcoming.forEach(function(p){
      var logKey = p.id;
      if (!force && log[logKey] === today) return;
      var title = p.diffDays < 0 ? ('⚠ ' + p.label + ' venció') : p.diffDays === 0 ? (p.label + ' vence hoy') : (p.label + ' — pago próximo');
      var bodyParts = [];
      if (p.diffDays < 0) bodyParts.push('Venció hace ' + Math.abs(p.diffDays) + ' día(s)');
      else if (p.diffDays === 0) bodyParts.push('Vence hoy');
      else bodyParts.push('Vence en ' + p.diffDays + ' día(s), el ' + formatDayMonthShort(p.date));
      if (p.person) bodyParts.push(p.person);
      if (p.note) bodyParts.push(p.note);
      if (p.amount) bodyParts.push(fmt(p.amount, p.currency || 'VES'));
      reg.showNotification(title, {
        body: bodyParts.join(' · '),
        icon: 'icon-192.png',
        badge: 'icon-192.png',
        tag: 'tubolsillo-pago-' + p.id
      });
      log[logKey] = today;
    });
    saveNotifiedLog(log);
  }).catch(function(e){ console.error('notification error', e); });
}

function downloadBlob(content, filename, mime){
  var blob = new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- respaldo en Google Drive (opcional, cuenta propia del usuario) ---------- */
function isGoogleDriveConfigured(){
  return GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf('TU_') !== 0;
}
var googleTokenClient = null;
function ensureGoogleTokenClient(){
  if (googleTokenClient) return googleTokenClient;
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) return null;
  googleTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: function(){} /* se reasigna en cada llamada según lo que se esté haciendo */
  });
  return googleTokenClient;
}
function fetchGoogleUserEmail(){
  fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
    headers: { Authorization: 'Bearer ' + state.driveAccessToken }
  }).then(function(r){ return r.json(); }).then(function(d){
    state.driveEmail = d.email || null;
    render();
  }).catch(function(){});
}
function connectGoogleDrive(){
  if (!isGoogleDriveConfigured()){
    window.alert('El respaldo en Google Drive todavía no está configurado en esta app.');
    return;
  }
  var client = ensureGoogleTokenClient();
  if (!client){ window.alert('No se pudo cargar Google. Revisa tu conexión a internet e intenta de nuevo.'); return; }
  state.driveStatus = 'connecting';
  render();
  client.callback = function(resp){
    if (resp.error){
      state.driveStatus = 'error';
      render();
      window.alert('No se pudo conectar con Google Drive.');
      return;
    }
    state.driveAccessToken = resp.access_token;
    state.driveTokenExpiry = Date.now() + (Number(resp.expires_in) || 3600) * 1000 - 60000;
    state.driveStatus = 'connected';
    fetchGoogleUserEmail();
    render();
  };
  client.requestAccessToken({ prompt: 'consent' });
}
function disconnectGoogleDrive(){
  if (state.driveAccessToken && typeof google !== 'undefined' && google.accounts && google.accounts.oauth2){
    try { google.accounts.oauth2.revoke(state.driveAccessToken, function(){}); } catch(e){}
  }
  state.driveAccessToken = null;
  state.driveTokenExpiry = 0;
  state.driveStatus = 'disconnected';
  state.driveEmail = null;
  state.driveFileId = null;
  render();
}
function ensureFreshDriveToken(){
  return new Promise(function(resolve, reject){
    if (state.driveAccessToken && Date.now() < state.driveTokenExpiry){ resolve(); return; }
    var client = ensureGoogleTokenClient();
    if (!client){ reject(new Error('Google no está disponible ahora mismo.')); return; }
    client.callback = function(resp){
      if (resp.error){ reject(new Error('No se pudo autenticar con Google.')); return; }
      state.driveAccessToken = resp.access_token;
      state.driveTokenExpiry = Date.now() + (Number(resp.expires_in) || 3600) * 1000 - 60000;
      state.driveStatus = 'connected';
      resolve();
    };
    client.requestAccessToken({ prompt: '' });
  });
}
function findDriveBackupFile(){
  var q = encodeURIComponent("name='" + DRIVE_BACKUP_FILENAME + "' and trashed=false");
  return fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&spaces=drive&fields=files(id,name,modifiedTime)', {
    headers: { Authorization: 'Bearer ' + state.driveAccessToken }
  }).then(function(r){ return r.json(); }).then(function(d){
    var f = (d.files && d.files[0]) || null;
    state.driveFileId = f ? f.id : null;
    return f;
  });
}
function backupToDrive(){
  if (!isGoogleDriveConfigured()){ window.alert('El respaldo en Google Drive todavía no está configurado en esta app.'); return; }
  state.driveStatus = 'working';
  render();
  ensureFreshDriveToken().then(function(){
    return findDriveBackupFile();
  }).then(function(existing){
    var content = JSON.stringify(buildFullBackup(), null, 2);
    var metadata = { name: DRIVE_BACKUP_FILENAME, mimeType: 'application/json' };
    var boundary = 'mibolsilloapp' + Date.now();
    var body = '--' + boundary + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\n' +
      'Content-Type: application/json\r\n\r\n' + content + '\r\n' +
      '--' + boundary + '--';
    var url = existing
      ? 'https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=multipart'
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    return fetch(url, {
      method: existing ? 'PATCH' : 'POST',
      headers: { Authorization: 'Bearer ' + state.driveAccessToken, 'Content-Type': 'multipart/related; boundary=' + boundary },
      body: body
    });
  }).then(function(r){
    if (!r.ok) throw new Error('drive upload failed: ' + r.status);
    return r.json();
  }).then(function(f){
    state.driveFileId = f.id;
    state.driveStatus = 'connected';
    state.driveLastBackupAt = new Date().toISOString();
    render();
    window.alert('Respaldo guardado en tu Google Drive.');
  }).catch(function(e){
    console.error('backupToDrive error', e);
    state.driveStatus = 'error';
    render();
    window.alert('No se pudo guardar el respaldo en Drive. Intenta de nuevo.');
  });
}
function restoreFromDrive(){
  if (!isGoogleDriveConfigured()){ window.alert('El respaldo en Google Drive todavía no está configurado en esta app.'); return; }
  state.driveStatus = 'working';
  render();
  ensureFreshDriveToken().then(function(){
    return findDriveBackupFile();
  }).then(function(existing){
    if (!existing){
      state.driveStatus = 'connected';
      render();
      window.alert('Todavía no hay ningún respaldo guardado en tu Google Drive.');
      return null;
    }
    return fetch('https://www.googleapis.com/drive/v3/files/' + existing.id + '?alt=media', {
      headers: { Authorization: 'Bearer ' + state.driveAccessToken }
    }).then(function(r){ return r.json(); });
  }).then(function(data){
    state.driveStatus = 'connected';
    if (!data){ render(); return; }
    var fecha = data.exportedAt ? new Date(data.exportedAt).toLocaleString() : 'fecha desconocida';
    if (!window.confirm('Esto reemplazará TODOS tus datos actuales en este teléfono con el respaldo de Google Drive (' + fecha + '). ¿Continuar?')){ render(); return; }
    state.transactions = data.transactions || [];
    state.goal = normalizeGoal(data.goal);
    state.budgets = data.budgets || {};
    state.initialBalance = data.initialBalance || { usd: 0, ves: 0 };
    state.paymentCommitments = data.paymentCommitments || {};
    state.customCategories = data.customCategories || { expense: [], income: [] };
    state.familyIncomeGoal = data.familyIncomeGoal || { usd: 0, ves: 0 };
    saveFamilyIncomeGoalToStorage();
    state.currentSavings = data.currentSavings || { monthly: {usd:0,ves:0}, weekly: {usd:0,ves:0} };
    state.savingsStart = data.savingsStart || { monthly: {usd:0,ves:0}, weekly: {usd:0,ves:0} };
    if (data.pro){ state.pro = data.pro; saveProToStorage(); }
    rebuildCategoryLists();
    saveData();
    saveBudgetsToStorage();
    Store.set(STORAGE_KEY_BALANCE, state.initialBalance);
    savePaymentsToStorage();
    saveCustomCategoriesToStorage();
    saveSavingsToStorage();
    saveSavingsStartToStorage();
    render();
    window.alert('Datos restaurados desde Google Drive.');
  }).catch(function(e){
    console.error('restoreFromDrive error', e);
    state.driveStatus = 'error';
    render();
    window.alert('No se pudo restaurar desde Drive. Intenta de nuevo.');
  });
}
function formatDDMMYYYY(dateStr){
  var d = new Date(dateStr + 'T00:00:00');
  return pad2(d.getDate()) + '/' + pad2(d.getMonth()+1) + '/' + d.getFullYear();
}
/* ---------- exportar Excel real (.xlsx) con formato ---------- */
var EXCELJS_CDN = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
var exceljsLoadPromise = null;
function loadExcelJS(){
  if (window.ExcelJS) return Promise.resolve();
  if (exceljsLoadPromise) return exceljsLoadPromise;
  exceljsLoadPromise = new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = EXCELJS_CDN;
    s.onload = function(){ resolve(); };
    s.onerror = function(){
      exceljsLoadPromise = null;
      reject(new Error('No se pudo cargar el generador de Excel. Revisa tu conexión a internet e intenta de nuevo.'));
    };
    document.head.appendChild(s);
  });
  return exceljsLoadPromise;
}

var XLS_TEAL = 'FF1F7A6C';
var XLS_TEAL_LIGHT = 'FFD9F0EA';
var XLS_ORANGE = 'FFF2994A';
var XLS_GREY = 'FFF2F2F2';
var XLS_BORDER = 'FFE3E3E3';
var XLS_TEXT = 'FF1B1F1E';
var XLS_RED = 'FFD64545';
var XLS_NUMFMT_VES = '"ves"#,##0.00;[Red]-"ves"#,##0.00';
var XLS_NUMFMT_USD = '"$ "#,##0.00;[Red]-"$ "#,##0.00';

function xlsThinBorder(){
  var b = { style: 'thin', color: { argb: XLS_BORDER } };
  return { top: b, left: b, bottom: b, right: b };
}
function xlsAmountText(n, prefix){
  var abs = Math.abs(n).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? '-' : '') + prefix + abs;
}
function setXlsAmountCell(cell, ves, usd, bold){
  var hasVES = ves !== 0, hasUSD = usd !== 0;
  if (hasVES && hasUSD){
    cell.value = { richText: [
      { text: xlsAmountText(ves, 'ves'), font: { bold: !!bold, color: { argb: ves < 0 ? XLS_RED : XLS_TEXT } } },
      { text: ' / ', font: { bold: !!bold, color: { argb: XLS_TEXT } } },
      { text: xlsAmountText(usd, '$ '), font: { bold: !!bold, color: { argb: usd < 0 ? XLS_RED : XLS_TEXT } } }
    ]};
  } else if (hasVES){
    cell.value = ves;
    cell.numFmt = XLS_NUMFMT_VES;
    if (bold) cell.font = { bold: true };
  } else if (hasUSD){
    cell.value = usd;
    cell.numFmt = XLS_NUMFMT_USD;
    if (bold) cell.font = { bold: true };
  }
}

function exportExcel(btn){
  var originalLabel = btn ? btn.textContent : null;
  if (btn){ btn.disabled = true; btn.textContent = 'Generando…'; }

  loadExcelJS().then(function(){
    var vd = getViewDate();
    var monthPrefix = vd.getFullYear() + '-' + pad2(vd.getMonth()+1);
    var monthTx = getMonthTx();
    var weeks = groupTxByWeek(monthTx).slice().reverse();
    var dailyRows = getDailyBalances();
    var dailyByDate = {};
    dailyRows.forEach(function(r){ dailyByDate[r.date] = r; });
    var categoryOrder = INCOME_CATEGORIES.concat(EXPENSE_CATEGORIES);

    var wb = new ExcelJS.Workbook();
    var sheetName = (MONTHS_ES[vd.getMonth()] + ' ' + vd.getFullYear()).slice(0, 31);
    var sheet = wb.addWorksheet(sheetName);
    var totalCols = 9; // DESCRIPCIÓN + 7 días + Subtotal

      .concat(new Array(7).fill(0).map(function(){ return { width: 13 }; }))
      .concat([{ width: 15 }]);

    var r = 1;
    sheet.mergeCells(r, 1, r, totalCols);
    var titleCell = sheet.getCell(r, 1);
    titleCell.value = 'Ingresos y Egresos - ' + MONTHS_ES[vd.getMonth()] + ' ' + vd.getFullYear();
    titleCell.font = { size: 16, bold: true, color: { argb: XLS_TEAL } };

    r += 2;

    weeks.forEach(function(w){
      var days = [];
      for (var i = 0; i <= 6; i++) days.push(addDaysStr(w.start, i));

      sheet.mergeCells(r, 1, r, totalCols);

      wTitle.value = 'Semana ' + formatDayMonthShort(w.start) + ' al ' + formatDayMonthShort(w.end);
      wTitle.font = { size: 12, bold: true, color: { argb: XLS_TEAL } };
      sheet.getRow(r).height = 20;

      var headerRowIdx = r;

      days.forEach(function(d, i){

          { text: formatDDMMYYYY(d), font: { size: 9, color: { argb: XLS_TEAL } } }
        ]};
      });
      headerRow.getCell(9).value = 'Subtotal';
      for (var c = 1; c <= totalCols; c++){

        hc.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        hc.border = xlsThinBorder();
        if (c === totalCols){
          hc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XLS_ORANGE } };
          hc.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        } else {
          hc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XLS_TEAL_LIGHT } };
          if (c === 1) hc.font = { bold: true, color: { argb: XLS_TEAL } };
        }
      }
      r += 1;

      // Balance Inicial
      var openingRow = sheet.getRow(r);
      openingRow.getCell(1).value = 'Balance Inicial';
      var lastOpeningVal = null;
      days.forEach(function(d, i){
        var rr = dailyByDate[d];
        var cell = openingRow.getCell(2 + i);
        if (rr && d.indexOf(monthPrefix) === 0){
          var opening = rr.balanceVES - rr.netVES;
          cell.value = opening;
          cell.numFmt = XLS_NUMFMT_VES;
          lastOpeningVal = opening;
        }
      });
      if (lastOpeningVal !== null){
        openingRow.getCell(9).value = lastOpeningVal;
        openingRow.getCell(9).numFmt = XLS_NUMFMT_VES;
      }
      for (var c2 = 1; c2 <= totalCols; c2++){

        oc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XLS_GREY } };
        oc.border = xlsThinBorder();
        oc.font = { italic: true, bold: true, color: { argb: XLS_TEXT } };
        oc.alignment = { horizontal: c2 === 1 ? 'left' : 'right', vertical: 'middle' };
      }
      r += 1;

      // categorías
      var catMap = {};
      w.txs.forEach(function(t){
        if (!catMap[t.category]) catMap[t.category] = {};
        if (!catMap[t.category][t.date]) catMap[t.category][t.date] = { ves: 0, usd: 0 };

        else catMap[t.category][t.date].ves += signedAmount(t);
      });

      categoryOrder.forEach(function(cat){

        row.getCell(1).value = cat.label;

        row.getCell(1).border = xlsThinBorder();
        row.getCell(1).alignment = { horizontal: 'left', vertical: 'middle' };
        var subVES = 0, subUSD = 0;
        days.forEach(function(d, i){

          cell.alignment = { horizontal: 'right', vertical: 'middle' };
          setXlsAmountCell(cell, cellData.ves, cellData.usd, false);
        });
        var subCell = row.getCell(9);
        subCell.border = xlsThinBorder();

          lastClosingVal = rr.balanceVES;

      });
      if (lastClosingVal !== null){
        closingRow.getCell(9).value = lastClosingVal;
        closingRow.getCell(9).numFmt = XLS_NUMFMT_VES;
      }
      for (var c3 = 1; c3 <= totalCols; c3++){

        ccell.alignment = { horizontal: c3 === 1 ? 'left' : 'right', vertical: 'middle' };
      }

    });

    return wb.xlsx.writeBuffer().then(function(buffer){
      var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var url = URL.createObjectURL(blob);

      URL.revokeObjectURL(url);
    });
  }).catch(function(err){
    console.error('exportExcel error', err);
    alert(err.message || 'No se pudo generar el Excel. Revisa tu conexión a internet e intenta de nuevo.');
  }).then(function(){

  });
}

function fetchWithTimeout(url, ms){
  var timeoutPromise = new Promise(function(_, reject){
    setTimeout(function(){ reject(new Error('timeout')); }, ms);
  });
  return Promise.race([ fetch(url, { cache: 'no-cache' }), timeoutPromise ]);
}

function fetchWithFailover(endpoints, timeoutMs, onSuccess, onExhausted){
  function tryIndex(i){
    if (i >= endpoints.length){ onExhausted(); return; }
    fetchWithTimeout(endpoints[i], timeoutMs)
      .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(onSuccess)
      .catch(function(err){
        console.error('fetch failover error (' + endpoints[i] + ')', err);
        tryIndex(i + 1);
      });
  }
  tryIndex(0);
}

function addDaysStr(dateStr, delta){
  var d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return d.toISOString().slice(0,10);
}
function mondayOf(dateStr){
  var d = new Date(dateStr + 'T00:00:00');
  var day = d.getDay();
  var diff = (day === 0) ? -6 : (1 - day);
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}
function formatDayMonthShort(dateStr){
  var d = new Date(dateStr + 'T00:00:00');
  return pad2(d.getDate()) + ' ' + MONTHS_ES[d.getMonth()].slice(0,3);
}
function monthKeyFromDate(dateStr){
  var d = new Date(dateStr + 'T00:00:00');
  return d.getFullYear() + '-' + pad2(d.getMonth()+1);
}
function monthLabelFromKey(key){
  var parts = key.split('-');
  return MONTHS_ES[Number(parts[1])-1] + ' ' + parts[0];
}
function groupTxByWeek(txs){
  var map = {};
  txs.forEach(function(t){
    var wk = mondayOf(t.date);
    if (!map[wk]) map[wk] = { key: 'movweek-' + wk, start: wk, end: addDaysStr(wk, 6), txs: [], netUSD: 0, netVES: 0 };
    map[wk].txs.push(t);
    if (t.currency === 'USD') map[wk].netUSD += signedAmount(t); else map[wk].netVES += signedAmount(t);
  });
  var groups = Object.keys(map).map(function(k){ return map[k]; });
  groups.sort(function(a,b){ return a.key < b.key ? 1 : -1; });
  groups.forEach(function(g){ g.txs.sort(function(a,b){ return a.date < b.date ? 1 : -1; }); });
  return groups;
}
function groupTxByCategory(txs){
  var map = {};
  txs.forEach(function(t){
    if (!map[t.category]) map[t.category] = { key: 'movcat-' + t.category, label: catLabel(t.category), txs: [], netUSD: 0, netVES: 0 };
    map[t.category].txs.push(t);
    if (t.currency === 'USD') map[t.category].netUSD += signedAmount(t); else map[t.category].netVES += signedAmount(t);
  });
  var groups = Object.keys(map).map(function(k){ return map[k]; });
  groups.sort(function(a,b){
    var magA = Math.abs(a.netVES) + Math.abs(a.netUSD) * 1000;
    var magB = Math.abs(b.netVES) + Math.abs(b.netUSD) * 1000;
    return magB - magA;
  });
  groups.forEach(function(g){ g.txs.sort(function(a,b){ return a.date < b.date ? 1 : -1; }); });
  return groups;
}
function groupDayRowsByWeek(rows, prefix){
  var map = {};
  rows.forEach(function(r){
    var wk = mondayOf(r.date);
    if (!map[wk]) map[wk] = { key: prefix + wk, start: wk, end: addDaysStr(wk, 6), rows: [], netUSD: 0, netVES: 0 };
    map[wk].rows.push(r);
    map[wk].netUSD += r.netUSD;
    map[wk].netVES += r.netVES;
  });
  var groups = Object.keys(map).map(function(k){ return map[k]; });
  groups.sort(function(a,b){ return a.key < b.key ? 1 : -1; });
  groups.forEach(function(g){ g.rows.sort(function(a,b){ return a.date < b.date ? 1 : -1; }); });
  return groups;
}

function getRateForDate(dateStr){

  for (var i = 1; i <= 60; i++){
    var earlier = addDaysStr(dateStr, -i);
    if (state.bcvHistory[earlier]) return state.bcvHistory[earlier];
  }
  if (dateStr === todayStr() && state.bcvRate.usd) return state.bcvRate.usd;

}

/* ---------- derived data ---------- */
function getViewDate(){
  var d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + state.monthOffset);
  return d;
}
function getMonthTx(){
  var key = getViewDate().toISOString().slice(0,7);
  return state.transactions
    .filter(function(t){ return monthKeyOf(t.date) === key; })
    .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
}
function getTotals(monthTx){
  var t = { incomeUSD:0, incomeVES:0, expenseUSD:0, expenseVES:0 };
  monthTx.forEach(function(tx){
    var key = (tx.type==='ingreso' ? 'income' : 'expense') + tx.currency;
    t[key] += Number(tx.amount) || 0;
  });
  return t;
}
function getCategoryBreakdown(monthTx){
  var map = {};
  monthTx.filter(function(t){ return t.type==='egreso'; }).forEach(function(tx){
    if (!map[tx.category]) map[tx.category] = { category: tx.category, ves: 0, usd: 0 };
    if (tx.currency === 'USD') map[tx.category].usd += Number(tx.amount) || 0;
    else map[tx.category].ves += Number(tx.amount) || 0;
  });
  var rows = Object.keys(map).map(function(k){ return map[k]; });
  rows.sort(function(a,b){
    var magA = Math.abs(a.ves) + Math.abs(a.usd) * 1000;
    var magB = Math.abs(b.ves) + Math.abs(b.usd) * 1000;
    return magB - magA;
  });
  return rows;
}

/* ================================================================
   COACH FINANCIERO
   Motor de reglas basado en principios profesionales de finanzas
   personales (liquidez, relación deuda/ingreso, fondo de emergencia,
   regla 50/30/20, exposición cambiaria). Todo se calcula localmente
   a partir de tus propios datos — no envía nada a ningún servidor,
   y no da recomendaciones específicas de inversión.
   ================================================================ */
function coachCombinedUSD(usd, ves){
  var rate = state.bcvRate.usd;
  return (Number(usd) || 0) + (rate ? (Number(ves) || 0) / rate : 0);
}
function coachPendingCommitments(){
  var totalUSD = 0, totalVES = 0;
  getPaymentCategories().forEach(function(catId){
    (state.paymentCommitments[catId] || []).forEach(function(p){
      if (p.paid) return;
      var amt = Number(p.amount) || 0;
      if (p.currency === 'USD') totalUSD += amt; else totalVES += amt;
    });
  });
  return { usd: totalUSD, ves: totalVES };
}
function getMonthProjection(){
  /* Solo tiene sentido si estamos viendo el mes real actual (no uno pasado/futuro navegado) */
  if (state.monthOffset !== 0) return null;
  var today = new Date();
  var diasTranscurridos = today.getDate();
  var diasTotales = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
  if (diasTranscurridos <= 0) return null;
  var monthTx = getMonthTx();
  var totals = getTotals(monthTx);
  var proyectadoUSD = (totals.expenseUSD / diasTranscurridos) * diasTotales;
  var proyectadoVES = (totals.expenseVES / diasTranscurridos) * diasTotales;
  var expenseCombinedSoFar = coachCombinedUSD(totals.expenseUSD, totals.expenseVES);
  var proyectadoCombinado = coachCombinedUSD(proyectadoUSD, proyectadoVES);
  return {
    diasTranscurridos: diasTranscurridos, diasTotales: diasTotales,
    expenseUSDSoFar: totals.expenseUSD, expenseVESSoFar: totals.expenseVES,
    proyectadoUSD: proyectadoUSD, proyectadoVES: proyectadoVES,
    expenseCombinedSoFar: expenseCombinedSoFar, proyectado: proyectadoCombinado
  };
}
function getFinancialScore(){
  var monthTx = getMonthTx();
  var totals = getTotals(monthTx);
  var incomeCombined = coachCombinedUSD(totals.incomeUSD, totals.incomeVES);
  var expenseCombined = coachCombinedUSD(totals.expenseUSD, totals.expenseVES);
  var netCombined = incomeCombined - expenseCombined;
  var saldo = getCurrentBalance();
  var ahorroApartado = state.currentSavings.monthly;
  var availableCombined = coachCombinedUSD(saldo.usd, saldo.ves) - coachCombinedUSD(ahorroApartado.usd, ahorroApartado.ves);
  var pending = coachPendingCommitments();
  var pendingCombined = coachCombinedUSD(pending.usd, pending.ves);
  var savingsCombined = coachCombinedUSD(ahorroApartado.usd, ahorroApartado.ves);
  var savingsMonths = expenseCombined > 0 ? savingsCombined / expenseCombined : (savingsCombined > 0 ? 3 : 0);
  var debtRatio = incomeCombined > 0 ? pendingCombined / incomeCombined : 0;

  var score = 0;
  // 1) Flujo de caja del mes (30 pts)
  if (incomeCombined > 0 || expenseCombined > 0){
    if (netCombined >= 0) score += 30;
    else if (incomeCombined > 0 && netCombined >= -0.1 * incomeCombined) score += 15;
  } else {
    score += 15; // sin datos aún, neutral
  }
  // 2) Cobertura de compromisos pendientes con saldo disponible (25 pts)
  if (pendingCombined <= 0) score += 25;
  else if (pendingCombined <= availableCombined) score += 25;
  else if (pendingCombined <= availableCombined * 1.5) score += 10;
  // 3) Fondo de emergencia / ahorro activo (20 pts)
  if (savingsMonths >= 3) score += 20;
  else if (savingsMonths >= 1) score += 12;
  else if (savingsMonths > 0) score += 6;
  // 4) Relación compromisos/ingreso (15 pts)
  if (debtRatio === 0) score += 15;
  else if (debtRatio <= 0.35) score += 15;
  else if (debtRatio <= 0.5) score += 8;
  // 5) Presupuestos respetados (10 pts)
  var breakdown = getCategoryBreakdown(monthTx);
  var budgetedIds = Object.keys(state.budgets).filter(function(id){ var b = state.budgets[id]; return b && ((b.usd||0) > 0 || (b.ves||0) > 0); });
  if (budgetedIds.length === 0) score += 10;
  else {
    var overCount = 0;
    budgetedIds.forEach(function(id){
      var b = state.budgets[id];
      var actual = breakdown.find(function(r){ return r.category === id; }) || { usd:0, ves:0 };
      var overUSD = b.usd > 0 && actual.usd > b.usd;
      var overVES = b.ves > 0 && actual.ves > b.ves;
      if (overUSD || overVES) overCount++;
    });
    var overFraction = overCount / budgetedIds.length;
    if (overFraction <= 0) score += 10;
    else if (overFraction <= 0.34) score += 6;
  }

  score = Math.max(0, Math.min(100, Math.round(score)));
  var band = score >= 80 ? { label: 'Sólida', color: 'var(--teal)' }
    : score >= 55 ? { label: 'Estable, con puntos de atención', color: '#E0A94E' }
    : { label: 'Requiere atención', color: 'var(--coral)' };
  var savingsRate = incomeCombined > 0 ? (savingsCombined / incomeCombined) * 100 : null;
  return { score: score, band: band, incomeCombined: incomeCombined, expenseCombined: expenseCombined, netCombined: netCombined, availableCombined: availableCombined, pendingCombined: pendingCombined, savingsCombined: savingsCombined, savingsMonths: savingsMonths, debtRatio: debtRatio, savingsRate: savingsRate };
}
function getCoachInsights(){
  var m = getFinancialScore();
  var monthTx = getMonthTx();
  var breakdown = getCategoryBreakdown(monthTx);
  var insights = [];

  // Flujo de caja
  if (m.incomeCombined > 0 || m.expenseCombined > 0){
    if (m.netCombined < 0){
      insights.push({ level:'danger', title:'Gastaste más de lo que ingresó', body:'Este mes tus egresos superaron a tus ingresos en aproximadamente ' + fmt(Math.abs(m.netCombined),'USD') + '. Si se repite varios meses seguidos, tu saldo y tu ahorro se van a ir achicando.' });
    } else if (m.incomeCombined > 0 && m.netCombined < 0.05 * m.incomeCombined){
      insights.push({ level:'warning', title:'Margen muy ajustado este mes', body:'Te quedó apenas ' + fmt(m.netCombined,'USD') + ' libre este mes (menos del 5% de tus ingresos). Cualquier imprevisto podría desequilibrarte.' });
    } else if (m.incomeCombined > 0 && m.netCombined >= 0.15 * m.incomeCombined){
      insights.push({ level:'success', title:'Buen margen este mes', body:'Te sobraron ' + fmt(m.netCombined,'USD') + ', equivalente a más del 15% de tus ingresos. Es un buen momento para reforzar tu ahorro.' });
    }
  }

  // Cobertura de compromisos pendientes
  if (m.pendingCombined > 0){
    if (m.pendingCombined > m.availableCombined){
      insights.push({ level:'danger', title:'Tus compromisos pendientes superan tu saldo disponible', body:'Tenés ' + fmt(m.pendingCombined,'USD') + ' en pagos pendientes, pero tu saldo disponible es de ' + fmt(m.availableCombined,'USD') + '. Te faltarían ' + fmt(m.pendingCombined - m.availableCombined,'USD') + ' para cubrirlos todos.' });
    } else if (m.pendingCombined > 0.7 * m.availableCombined){
      insights.push({ level:'warning', title:'Tus compromisos ya comprometen la mayor parte de tu saldo', body:'Los ' + fmt(m.pendingCombined,'USD') + ' que tenés pendientes de pago representan más del 70% de tu saldo disponible (' + fmt(m.availableCombined,'USD') + ').' });
    } else {
      insights.push({ level:'success', title:'Tu saldo cubre tus compromisos pendientes', body:'Tus ' + fmt(m.pendingCombined,'USD') + ' en pagos pendientes están cubiertos cómodamente por tu saldo disponible.' });
    }
  }

  // Fondo de emergencia
  if (m.expenseCombined > 0){
    if (m.savingsMonths < 1){
      insights.push({ level:'warning', title:'Tu fondo de emergencia es bajo', body:'Tu ahorro actual cubriría menos de 1 mes de gastos al ritmo de este mes. El estándar profesional es tener entre 3 y 6 meses de gastos cubiertos antes de pensar en otros objetivos financieros.' });
    } else if (m.savingsMonths < 3){
      insights.push({ level:'info', title:'Vas construyendo tu fondo de emergencia', body:'Tu ahorro cubre aproximadamente ' + m.savingsMonths.toFixed(1) + ' mes(es) de gastos. La meta recomendada es entre 3 y 6 meses.' });
    } else {
      insights.push({ level:'success', title:'Fondo de emergencia saludable', body:'Tu ahorro cubre ' + m.savingsMonths.toFixed(1) + ' meses de gastos — dentro del rango profesional recomendado (3-6 meses).' });
    }
  }

  // Relación compromisos / ingreso
  if (m.debtRatio > 0){
    if (m.debtRatio > 0.5){
      insights.push({ level:'danger', title:'Tus compromisos de pago son muy altos frente a tus ingresos', body:'Representan el ' + Math.round(m.debtRatio*100) + '% de tus ingresos del mes — muy por encima del 35-40% que la banca usa como umbral de riesgo al evaluar capacidad de pago.' });
    } else if (m.debtRatio > 0.35){
      insights.push({ level:'warning', title:'Tus compromisos de pago están en zona de atención', body:'Representan el ' + Math.round(m.debtRatio*100) + '% de tus ingresos del mes, cerca del umbral de riesgo (35-40%) usado por la banca.' });
    }
  }

  // Presupuestos superados (hasta 2)
  var overBudget = [];
  Object.keys(state.budgets).forEach(function(id){
    var b = state.budgets[id];
    if (!b) return;
    var actual = breakdown.find(function(r){ return r.category === id; }) || { usd:0, ves:0 };
    if (b.usd > 0 && actual.usd > b.usd) overBudget.push({ id:id, pct: Math.round((actual.usd/b.usd)*100) });
    else if (b.ves > 0 && actual.ves > b.ves) overBudget.push({ id:id, pct: Math.round((actual.ves/b.ves)*100) });
  });
  overBudget.sort(function(a,b){ return b.pct - a.pct; });
  overBudget.slice(0,2).forEach(function(o){
    insights.push({ level:'warning', title:'Presupuesto de ' + catLabel(o.id) + ' superado', body:'Ya llevás el ' + o.pct + '% de tu presupuesto mensual en esta categoría.' });
  });

  // Exposición cambiaria
  var saldo = getCurrentBalance();
  if (state.bcvRate.usd && (saldo.usd !== 0 || saldo.ves !== 0)){
    var totalC = coachCombinedUSD(saldo.usd, saldo.ves);
    if (totalC > 0){
      var vesShare = Math.round((coachCombinedUSD(0, saldo.ves) / totalC) * 100);
      if (vesShare >= 60){
        insights.push({ level:'info', title:'Buena parte de tu saldo está en bolívares', body:'Aproximadamente el ' + vesShare + '% de tu saldo total está en Bs., expuesto a la variación del tipo de cambio. Mantener una porción en USD ayuda a preservar poder adquisitivo en contextos de alta inflación.' });
      }
    }
  }

  // Proyección de fin de mes
  var proj = getMonthProjection();
  if (proj && m.incomeCombined > 0){
    if (proj.proyectado > m.incomeCombined * 1.05){
      var gastadoTxt = (proj.expenseUSDSoFar>0?fmt(proj.expenseUSDSoFar,'USD'):'') + (proj.expenseUSDSoFar>0&&proj.expenseVESSoFar>0?' y ':'') + (proj.expenseVESSoFar>0?fmt(proj.expenseVESSoFar,'VES'):'');
      var proyTxt = (proj.proyectadoUSD>0?fmt(proj.proyectadoUSD,'USD'):'') + (proj.proyectadoUSD>0&&proj.proyectadoVES>0?' y ':'') + (proj.proyectadoVES>0?fmt(proj.proyectadoVES,'VES'):'');
      insights.push({ level:'warning', title:'Al ritmo actual, vas a cerrar el mes por encima de tu ingreso', body:'Llevás gastado ' + gastadoTxt + ' en ' + proj.diasTranscurridos + ' de ' + proj.diasTotales + ' días. Proyectado a fin de mes: ≈ ' + proyTxt + '.' });
    }
  }

  var order = { danger: 0, warning: 1, info: 2, success: 3 };
  insights.sort(function(a,b){ return order[a.level] - order[b.level]; });
  return insights.slice(0, 6);
}

function getDailyBalances(){

  var dailyNet = {};
  state.transactions.forEach(function(tx){
    dailyNet[tx.date] = dailyNet[tx.date] || { usd: 0, ves: 0, count: 0 };
    dailyNet[tx.date][tx.currency === 'USD' ? 'usd' : 'ves'] += signedAmount(tx);
    dailyNet[tx.date].count += 1;
  });

  var runningUSD = state.initialBalance.usd, runningVES = state.initialBalance.ves;
  var sortedDates = state.transactions.map(function(t){ return t.date; }).sort();
  var earliestDate = sortedDates.length ? sortedDates[0] : monthStart;
  var openingRate = getRateForDate(earliestDate < monthStart ? earliestDate : monthStart);
  var runningCombined = state.initialBalance.usd + (openingRate ? state.initialBalance.ves / openingRate : 0);

  var priorTx = state.transactions.filter(function(t){ return t.date < monthStart; }).sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  priorTx.forEach(function(tx){
    var amt = signedAmount(tx);
    if (tx.currency === 'USD'){
      runningUSD += amt; runningCombined += amt;
    } else {
      runningVES += amt;
      var r = getRateForDate(tx.date);
      if (r) runningCombined += amt / r;
    }
  });

  var rows = [];
  for (var d = 1; d <= lastDay; d++){
    var dateStr = year + '-' + pad2(month + 1) + '-' + pad2(d);
    var net = dailyNet[dateStr] || { usd: 0, ves: 0, count: 0 };
    var dayRate = getRateForDate(dateStr);
    var netCombined = net.usd + (dayRate ? net.ves / dayRate : 0);
    runningUSD += net.usd;
    runningVES += net.ves;
    runningCombined += netCombined;
    rows.push({ date: dateStr, day: d, netUSD: net.usd, netVES: net.ves, hasTx: net.count > 0, balanceUSD: runningUSD, balanceVES: runningVES, dayRate: dayRate, netCombined: netCombined, balanceCombined: runningCombined });
  }
  return rows;
}

function getMonthOpeningBalance(){
  var vd = getViewDate();
  var monthStart = vd.getFullYear() + '-' + pad2(vd.getMonth() + 1) + '-01';
  var usd = state.initialBalance.usd, ves = state.initialBalance.ves;
  state.transactions.forEach(function(tx){
    if (tx.date < monthStart){
      if (tx.currency === 'USD') usd += signedAmount(tx); else ves += signedAmount(tx);
    }
  });
  return { usd: usd, ves: ves };
}

function setView(v){ state.view = v; render(); }
function changeMonth(delta){
  if (delta > 0 && state.monthOffset >= 0) return;
  state.monthOffset += delta;
  render();
}
function openForm(){
  state.form = { type:'egreso', currency:'VES', category: (EXPENSE_CATEGORIES[0] ? EXPENSE_CATEGORIES[0].id : ''), amount:'', date: todayStr(), note:'' };
  state.editingId = null;
  state.showForm = true;
  state.showNewCategoryInput = EXPENSE_CATEGORIES.length === 0;
  render();
}
function editTransaction(id){
  var tx = state.transactions.find(function(t){ return t.id === id; });
  if (!tx) return;
  state.form = { type: tx.type, currency: tx.currency, category: tx.category, amount: String(tx.amount), date: tx.date, note: tx.note || '' };
  state.editingId = id;
  state.showForm = true;
  render();
}
function closeForm(){ state.showForm = false; state.editingId = null; render(); }
function setFormType(t){
  state.form.type = t;
  var list = t === 'egreso' ? EXPENSE_CATEGORIES : INCOME_CATEGORIES;
  state.form.category = list.length ? list[0].id : '';
  state.showNewCategoryInput = list.length === 0;
  render();
}
function setFormCurrency(c){ state.form.currency = c; render(); }
function toggleNewCategoryInput(){
  state.showNewCategoryInput = !state.showNewCategoryInput;
  render();
  if (state.showNewCategoryInput){
    setTimeout(function(){ var el = document.getElementById('newCategoryLabel'); if (el) el.focus(); }, 0);
  }
}
function confirmAddCategory(){
  var el = document.getElementById('newCategoryLabel');
  var label = el ? el.value : '';
  var id = addCustomCategory(state.form.type, label);
  if (id){
    state.form.category = id;
    state.showNewCategoryInput = false;
    render();
  }
}
function setFormField(field, value){ state.form[field] = value; }
function saveTransaction(){
  var f = state.form;
  var amt = Number(f.amount);
  if (!(amt > 0) || !f.date || !f.category) return;
  if (state.editingId){
    var idx = state.transactions.findIndex(function(t){ return t.id === state.editingId; });
    if (idx > -1){
      var existing = state.transactions[idx];
      state.transactions[idx] = {
        id: existing.id, type: f.type, category: f.category, amount: amt,
        currency: f.currency, date: f.date, note: (f.note||'').trim(),
        source: existing.source
      };
    }
  } else {
    state.transactions.unshift({
      id: uid(), type: f.type, category: f.category, amount: amt,
      currency: f.currency, date: f.date, note: (f.note||'').trim()
    });
  }
  saveData();
  state.showForm = false;
  state.editingId = null;
  render();
  pushToCloud();
}
function deleteTransaction(id){
  state.transactions = state.transactions.filter(function(t){ return t.id !== id; });
  saveData();
  render();
  pushToCloud();
}
function saveGoal(period, usd, ves){
  state.goal[period] = { usd: Number(usd)||0, ves: Number(ves)||0 };
  saveData();
  render();
  pushToCloud();
}

  state.currentSavings = Store.get(STORAGE_KEY_SAVINGS, state.currentSavings);

function saveSavingsToStorage(){

  var monthTx = getMonthTx();
  var totals = getTotals(monthTx);
  var breakdown = getCategoryBreakdown(monthTx);
  var viewDate = getViewDate();
  var monthLabel = MONTHS_ES[viewDate.getMonth()] + ' ' + viewDate.getFullYear();

  var html = '';

  html += '  <div style="display:flex;align-items:center;gap:8px"><span style="color:var(--gold)">' + ICONS.wallet2 + '</span></div>';
  html += '</div>';

  html += '  <div class="month-label">' + esc(monthLabel) + '</div>';
  html += '  <button class="icon-btn" ' + (state.monthOffset>=0?'disabled':'') + ' onclick="changeMonth(1)">' + ICONS.chevronRight + '</button>';
  html += '</div>';

  if (state.view === 'resumen') html += renderRateBar();

  html += '<div class="main">';
  if (state.view === 'resumen') html += renderResumen(totals, breakdown);
  else if (state.view === 'movimientos') html += renderMovimientos(monthTx);

  else if (state.view === 'metas') html += renderMetas(totals, monthTx);

function renderRateBar(){
  var r = state.bcvRate;
  var label, sub;
  if (state.rateStatus === 'loading' && !r.usd){
    label = 'Consultando tasa BCV…';
    sub = '';
  } else if (r.usd){
    label = 'BCV hoy: ' + fmt(r.usd, 'VES') + ' / $';
    sub = r.date ? 'Vigente ' + esc(r.date) : '';
    if (state.rateStatus === 'error') sub = 'Sin conexión · última tasa guardada' + (r.date ? ' (' + esc(r.date) + ')' : '');
  } else {
    label = 'Tasa BCV no disponible';
    sub = state.rateStatus === 'error' ? 'No se pudo conectar. Verifica tu internet.' : '';
  }
  var spinning = state.rateStatus === 'loading';
  var html = '<div class="rate-bar">';
  html += '  <div><div class="rate-label">' + label + '</div>' + (sub ? '<div class="rate-sub">' + sub + '</div>' : '') + '</div>';
  html += '  <button class="icon-btn ' + (spinning?'spin':'') + '" onclick="fetchBcvRate()" title="Actualizar tasa">' + ICONS.refresh + '</button>';
  html += '</div>';
  return html;
}

function navBtn(view, icon, label){
  var active = state.view === view;

function renderCatCurrencyLine(amount, currency, maxAmt, budgetAmt, budgetIsConverted, budgetOrigAmt, budgetOrigCurrency){
  var pct = Math.max(4, Math.round((amount / maxAmt) * 100));
  var barColor = 'var(--coral)';
  var badge = '';
  var bottomLine = '<div class="cat-currency-bottom">' + fmt(amount, currency) + '</div>';
  if (budgetAmt > 0){
    var bpct = Math.round((amount / budgetAmt) * 100);
    var badgeClass = 'badge-ok';
    if (bpct >= 100){ barColor = '#ff5c5c'; badgeClass = 'badge-over'; }
    else if (bpct >= 80){ barColor = '#E0A94E'; badgeClass = 'badge-warn'; }
    badge = '<span class="cat-pct-badge ' + badgeClass + '">' + bpct + '%' + (bpct>=100?' ⚠':'') + '</span>';
    var budgetDesc = budgetIsConverted
      ? ('≈ ' + fmt(budgetAmt, currency) + ' <span class="cat-budget-of">(presupuesto: ' + fmt(budgetOrigAmt, budgetOrigCurrency) + ' a la tasa de hoy)</span>')
      : (fmt(budgetAmt, currency) + budgetEquivalentInline(budgetAmt, currency));
    bottomLine = '<div class="cat-currency-bottom">' + fmt(amount, currency) + ' <span class="cat-budget-of">de</span> ' + budgetDesc + '</div>';
  }
  var html = '<div class="cat-currency-line">';
  html += '  <div class="cat-currency-top"><span class="cat-currency-tag">' + (currency==='USD'?'$':'Bs.') + '</span>' + badge + '</div>';
  html += '  <div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>';
  html += bottomLine;
  html += '</div>';
  return html;
}

function renderPaymentAlerts(){
  var upcoming = getUpcomingPayments().filter(function(p){ return p.diffDays <= 7; });
  if (!upcoming.length) return '';

  var byCat = {};
  upcoming.forEach(function(p){
    if (!byCat[p.catId]) byCat[p.catId] = { catId: p.catId, label: p.label, items: [], minDiff: p.diffDays };
    byCat[p.catId].items.push(p);
    if (p.diffDays < byCat[p.catId].minDiff) byCat[p.catId].minDiff = p.diffDays;
  });
  var groups = Object.keys(byCat).map(function(k){ return byCat[k]; });
  groups.sort(function(a,b){ return a.minDiff - b.minDiff; });

  var html = '<div class="section-label" style="color:var(--coral);font-weight:700;letter-spacing:1.2px">⚠ Próximos pagos</div>';
  groups.forEach(function(g, gi){
    var key = 'resumenpago-' + g.catId;
    var expanded = isGroupExpanded(key, gi);

  });

  return html;

function renderGoalRing(pct, colorOverride){
  var raw = pct;
  var clamped = Math.max(0, Math.min(100, pct));
  var r = 38, circ = 2 * Math.PI * r;
  var offset = circ - (clamped / 100) * circ;
  var color = colorOverride || (raw >= 100 ? 'var(--teal)' : (raw >= 60 ? 'var(--gold)' : 'var(--coral)'));
  var svg = '<svg width="92" height="92" viewBox="0 0 92 92" style="flex-shrink:0">';
  svg += '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="9"/>';
  svg += '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + circ + '" stroke-dashoffset="' + offset + '" transform="rotate(-90 46 46)"/>';
  svg += '<text x="46" y="52" text-anchor="middle" font-family="var(--font-mono)" font-size="18" font-weight="700" fill="' + color + '">' + Math.round(raw) + '%</text>';
  svg += '</svg>';
  return svg;
}

function renderBudgetVsRealIncomeCard(totals){
  var sumUsd = 0, sumVes = 0;
  Object.keys(state.budgets).forEach(function(id){
    var b = state.budgets[id];
    if (!b) return;
    sumUsd += Number(b.usd) || 0;
    sumVes += Number(b.ves) || 0;
  });
  if (sumUsd === 0 && sumVes === 0){
    return '<div class="empty-note" style="padding-top:0">Todavía no definiste presupuestos por categoría (Ajustes → Presupuesto por Categoría).</div>';
  }
  if (totals.incomeUSD === 0 && totals.incomeVES === 0){
    return '<div class="empty-note" style="padding-top:0">Todavía no cargaste ingresos este mes — en cuanto lo hagas, vas a ver acá qué porcentaje de lo que ya cobraste está comprometido en presupuesto.</div>';
  }
  var html = '';
  if (sumUsd > 0 && totals.incomeUSD > 0){
    var pctU = Math.round((sumUsd / totals.incomeUSD) * 100);
    var colorU = pctU > 100 ? 'var(--coral)' : 'var(--teal)';
    html += '<div class="goal-card">';
    html += '  <div class="goal-row"><span>Presupuesto vs Ingreso Real (USD)</span><span class="goal-pct" style="color:' + colorU + '">' + pctU + '%</span></div>';
    html += '  <div class="bar-track"><div class="bar-fill-gold" style="width:' + Math.min(100,pctU) + '%;background:' + colorU + '"></div></div>';
    html += '  <div class="goal-numbers">' + fmt(sumUsd,'USD') + ' presupuestado de ' + fmt(totals.incomeUSD,'USD') + ' ya cobrado' + (pctU>100?' · Ya comprometiste más de lo que entró':'') + '</div>';
    html += '</div>';
  }
  if (sumVes > 0 && totals.incomeVES > 0){
    var pctV = Math.round((sumVes / totals.incomeVES) * 100);
    var colorV = pctV > 100 ? 'var(--coral)' : 'var(--teal)';
    html += '<div class="goal-card" style="margin-top:8px">';
    html += '  <div class="goal-row"><span>Presupuesto vs Ingreso Real (Bs.)</span><span class="goal-pct" style="color:' + colorV + '">' + pctV + '%</span></div>';
    html += '  <div class="bar-track"><div class="bar-fill-gold" style="width:' + Math.min(100,pctV) + '%;background:' + colorV + '"></div></div>';
    html += '  <div class="goal-numbers">' + fmt(sumVes,'VES') + ' presupuestado de ' + fmt(totals.incomeVES,'VES') + ' ya cobrado' + (pctV>100?' · Ya comprometiste más de lo que entró':'') + '</div>';
    html += '</div>';
  }
  if (!html){
    html = '<div class="empty-note" style="padding-top:0">Tenés presupuesto definido en una moneda distinta a la que cargaste ingresos este mes — no hay una comparación directa disponible todavía.</div>';
  }
  return html;
}

function renderBudgetVsPaymentsCard(){
  var sumUsd = 0, sumVes = 0;
  Object.keys(state.budgets).forEach(function(id){
    var b = state.budgets[id];
    if (!b) return;
    sumUsd += Number(b.usd) || 0;
    sumVes += Number(b.ves) || 0;
  });
  var pending = coachPendingCommitments();
  if (sumUsd === 0 && sumVes === 0){
    return '<div class="empty-note" style="padding-top:0">Todavía no definiste presupuestos por categoría.</div>';
  }
  if (pending.usd === 0 && pending.ves === 0){
    return '<div class="empty-note" style="padding-top:0">No tenés compromisos de pago pendientes registrados este mes.</div>';
  }
  var html = '';
  if (sumUsd > 0){
    var pctU = Math.round((pending.usd / sumUsd) * 100);
    var colorU = pctU > 80 ? 'var(--coral)' : 'var(--gold)';
    html += '<div class="goal-card">';
    html += '  <div class="goal-row"><span>Pagos comprometidos del Presupuesto (USD)</span><span class="goal-pct" style="color:' + colorU + '">' + pctU + '%</span></div>';
    html += '  <div class="bar-track"><div class="bar-fill-gold" style="width:' + Math.min(100,pctU) + '%;background:' + colorU + '"></div></div>';
    html += '  <div class="goal-numbers">' + fmt(pending.usd,'USD') + ' en pagos fijos de ' + fmt(sumUsd,'USD') + ' presupuestados — el resto queda libre para gasto variable</div>';
    html += '</div>';
  }
  if (sumVes > 0){
    var pctV = Math.round((pending.ves / sumVes) * 100);
    var colorV = pctV > 80 ? 'var(--coral)' : 'var(--gold)';
    html += '<div class="goal-card" style="margin-top:8px">';
    html += '  <div class="goal-row"><span>Pagos comprometidos del Presupuesto (Bs.)</span><span class="goal-pct" style="color:' + colorV + '">' + pctV + '%</span></div>';

    html += '</div>';
  }
  return html;
}

function renderPresupuesto(){
  var html = '<div class="section-label" style="margin-top:26px">Presupuesto por Categoria</div>';
  html += '<div class="empty-note" style="padding-top:0">Define un límite mensual por categoría, en Bs. o en $. Si lo pones en $, la app muestra el equivalente en Bs. a la tasa de hoy — el % de cumplimiento siempre se calcula en la moneda original, no se mezcla.</div>';

  var totalUSD = 0, totalVES = 0;
  EXPENSE_CATEGORIES.forEach(function(c){
    var b = state.budgets[c.id] || { usd: 0, ves: 0 };
    totalUSD += Number(b.usd) || 0;
    totalVES += Number(b.ves) || 0;
  });
  if (totalUSD > 0 || totalVES > 0){
    html += '<div class="goal-card" style="margin-bottom:18px">';
    html += '  <div class="goal-row"><span>Total de Presupuesto</span></div>';
    html += '  <div class="goal-numbers" style="font-size:14px;font-weight:700;color:var(--gold)">' + (totalUSD>0?fmt(totalUSD,'USD'):'') + (totalUSD>0&&totalVES>0?' + ':'') + (totalVES>0?fmt(totalVES,'VES'):'') + '</div>';
    html += '</div>';
  }

  EXPENSE_CATEGORIES.forEach(function(c){
    var b = state.budgets[c.id] || { usd: 0, ves: 0 };
    html += '<div class="form-group"><label class="form-label">' + esc(c.label) + '</label>';
    html += '  <div class="form-row">';
    html += '    <input class="input" type="number" inputmode="decimal" placeholder="Bs." id="budgetVes_' + c.id + '" value="' + (b.ves || '') + '" style="flex:1">';
    html += '    <input class="input" type="number" inputmode="decimal" placeholder="$" id="budgetUsd_' + c.id + '" value="' + (b.usd || '') + '" style="width:90px">';
    html += '  </div>';
    if (b.usd > 0 || b.ves > 0){
      var notes = [];
      if (b.usd > 0) notes.push('$' + b.usd + budgetEquivalentInline(b.usd, 'USD'));
      if (b.ves > 0) notes.push('Bs.' + b.ves + budgetEquivalentInline(b.ves, 'VES'));
      html += '  <div class="budget-note">' + notes.join(' · ') + '</div>';
    }
    html += '</div>';
  });
  html += '<button class="primary-btn" onclick="saveBudgets()">Guardar presupuestos</button>';
  return html;
}

    html += '  <button class="primary-btn" style="background:var(--surface-2);color:var(--gold);border:1px solid var(--gold);margin-bottom:8px" onclick="backupToDrive()">Guardar respaldo en Drive</button>';
